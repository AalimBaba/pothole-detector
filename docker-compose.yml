version: '3.8'

services:
  web:
    build: .
    volumes:
      - ./app/static/uploads:/app/app/static/uploads
      - ./app/static/reports:/app/app/static/reports
      - ./app/static/frames:/app/app/static/frames
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///data/potholes.db
    restart: always

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    restart: always
